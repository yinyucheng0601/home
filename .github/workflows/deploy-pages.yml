name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kristy-universe/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: kristy-universe
      - name: Build website
        run: npm run build
        working-directory: kristy-universe
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site/kristy-universe
          cp -R kristy-universe/dist/. _site/kristy-universe/
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./kristy-universe/"><a href="./kristy-universe/">Open website</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
